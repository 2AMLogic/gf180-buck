name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest
# (manifests/gf180-buck.json) and byte-compare the fresh output against the
# committed verdict of record (manifests/gf180-buck.signoff.json).
#
# A manifest citing evidence that has since changed makes the fresh render
# differ from the committed record, and this check fails rather than letting
# the record rot: whoever changes the manifest, cited evidence, or the
# vendored checklist doc must regenerate the record in the same PR.
#
# T1 item 10 (repo hygiene) is attested, not asserted: the committed envelope
# manifests/item10-attestation.json is re-attested from
# manifests/item10-inventory.json and must still reproduce and pass.
#
# T1 item 9 (testbenches shipped) is attested too: evidence/item9.json is
# re-hashed against attest/item9.json. Its cold start (sim/cold-start.sh)
# needs the PDK, ngspice and the batch fleet, so it is local_only: CI skips it
# and carries the committed outcome (listed under skipped_checks, not a pass).
#
# See manifests/README.md for the convention.
#
# The repository's stdlib-only unit tests run first, through the package.json
# `test` entry point (`npm run --silent test`), so a change that breaks a
# grader in sim/lib or a netlist geometry check fails here rather than passing
# CI unnoticed. That entry point is the same one a developer runs locally, so
# the two cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Unit tests (stdlib only)
        run: npm run --silent test

      - name: Install pinned klt
        run: pip install klayout-tools==0.9.0

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/gf180-buck.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at
          # least one item is unmet. Both are valid runs. Anything else is a
          # hard error (manifest/doc unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/gf180-buck.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/gf180-buck.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/gf180-buck.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/gf180-buck.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/gf180-buck.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh: it matches a fresh klt signoff run."
          python3 -c "import json; d=json.load(open('manifests/gf180-buck.signoff.json')); print('tier verdict of record:', d['tier'], '(T1 items met: %d/%d)' % (d['t1_met_count'], d['t1_item_count']))"

      - name: Re-attest T1 item 10 and compare against the committed envelope
        run: |
          set -uo pipefail
          # Exit 0 = the envelope still reproduces and passes; 3 = drift or a
          # failing check; 1 = malformed inventory or envelope.
          if ! klt signoff --attest 10 \
                 --inventory manifests/item10-inventory.json \
                 --check manifests/item10-attestation.json; then
            echo "::error::T1 item 10 attestation drifted or fails - a hygiene file, the inventory, or a check changed."
            echo "Regenerate and commit the envelope, then the verdict of record, in this same PR (see manifests/README.md)."
            exit 1
          fi

      - name: Re-attest T1 item 1 and compare against the committed envelope
        run: |
          set -uo pipefail
          # The netlist freshness checks need xschem and the PDK, so the
          # inventory marks them local_only: --check skips them here and
          # carries the committed outcome. Source and netlist content hashes,
          # the file set and the inventory itself are still re-verified, so
          # editing any listed file without re-attesting fails this step.
          if ! klt signoff --attest 1 \
                 --inventory design/inventory-item1.json \
                 --check manifests/item1-attestation.json; then
            echo "::error::T1 item 1 attestation drifted or fails - a design source, a derived netlist or the inventory changed."
            echo "Run design/netlist.sh, then re-attest item 1 locally, regenerate the item-10 envelope and the verdict of record in this same PR (see manifests/README.md)."
            exit 1
          fi

      - name: Re-attest T1 item 9 and compare against the committed envelope
        run: |
          set -uo pipefail
          # The cold start is local_only, so --check skips it and carries the
          # committed outcome (reported under skipped_checks). Every inventoried
          # bench file is still re-hashed, so editing a listed bench without
          # re-attesting fails this step. A bench added without being listed
          # is NOT caught here: the PR that adds a bench must edit the inventory.
          if ! klt signoff --attest 9 \
                 --inventory attest/item9.json \
                 --check evidence/item9.json; then
            echo "::error::T1 item 9 attestation drifted or fails - a bench file or the inventory changed."
            echo "Re-run sim/cold-start.sh via the attest command in sim/README.md and commit the envelope in this same PR."
            exit 1
          fi
